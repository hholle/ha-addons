# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: vcontrold
version: "1.1.18"
slug: vcontrold
description: vcontrold - Viessmann Vito heating MQTT communication
url: "https://github.com/hholle/ha-addons/tree/main/vcontrold"
arch:
  - amd64
services:
  - 'mqtt:need'
devices:
  - /dev/ttyUSBVito
init: false
apparmor: false
uart: true
#image: "ghcr.io/hholle/{arch}-addon-vcontrold"
options:
  device: /dev/ttyUSBVito
schema:
  device: str
