# https://developers.home-assistant.io/docs/apps/configuration/
name: Warema WMS
version: "2.2.1"
slug: warema_wms
description: Warema WMS blinds, awnings and roofs via WMS USB stick → MQTT with HA discovery
url: "https://github.com/hholle/ha-addons/tree/main/warema-wms"
arch:
  - amd64
services:
  - 'mqtt:need'
init: false
uart: true
#image: "ghcr.io/hholle/{arch}-addon-warema-wms"
options:
  wms_serial_port: /dev/ttyUSB0
  wms_pan_id: FFFF
  wms_channel: 17
  polling_interval: 30000
  moving_interval: 1000
  rescan_interval: 0
  quality_interval: 300
  log_level: info
schema:
  wms_serial_port: device(subsystem=tty)
  wms_key: password?
  wms_pan_id: str?
  wms_channel: int?
  ignored_devices: str?
  force_devices: str?
  device_groups: str?
  polling_interval: int(5000,600000)?
  moving_interval: int(100,60000)?
  rescan_interval: int(0,1440)?
  quality_interval: int(0,3600)?
  log_level: list(error|warning|info|debug)?
